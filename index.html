<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kite And Manja Store</title>
<style>
:root{--p:#35104b;--p2:#6b2d78;--gold:#d4a72c;--bg:#f7efe3;--green:#16c96b;--text:#241c28}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.top{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 12px #0001;padding:14px 18px;display:flex;align-items:center}
.logo{width:45px;height:45px;border-radius:50%;background:var(--p);color:#ffd95a;display:grid;place-items:center;font-weight:900;margin-right:10px}
.brand h1{font-size:18px;margin:0}.brand p{margin:2px 0 0;color:#777;font-size:11px}
.wrap{max-width:1100px;margin:auto;padding:15px}
.hero{border-radius:20px;background:linear-gradient(120deg,#35104b,#8b4b86);color:#fff;padding:25px;display:flex;justify-content:space-between;align-items:center}
.hero h2{margin:0 0 8px;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:20px}
.card{background:#fff;border-radius:18px;padding:12px;border:1px solid #eadfd4}
.photo{height:150px;background:#eee;border-radius:12px;display:grid;place-items:center;font-size:50px}
.card h3{margin:10px 0 5px;font-size:16px}.price{font-size:18px;font-weight:900;color:var(--p)}
.buybtn{width:100%;padding:10px;margin-top:10px;border-radius:10px;background:var(--green);color:#fff;font-weight:bold;border:0;cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <div class="logo">KM</div>
  <div class="brand"><h1>KITE AND MANJA STORE</h1><p>QUALITY PRODUCTS</p></div>
</div>
<main class="wrap">
  <section class="hero">
    <div><h2>New Collection</h2><p>Welcome to our official store!</p></div>
    <div style="font-size:50px">🪁</div>
  </section>
  <div class="grid">
    <div class="card"><div class="photo">🪁</div><h3>Special Kite Reel</h3><div class="price">₹499.00</div><button class="buybtn" onclick="alert('Order via WhatsApp coming soon!')">Buy Now</button></div>
    <div class="card"><div class="photo">🧵</div><h3>Mono Kita Manja</h3><div class="price">₹799.00</div><button class="buybtn" onclick="alert('Order via WhatsApp coming soon!')">Buy Now</button></div>
  </div>
</main>
</body>
</html>
